[metadata]
name = SoftCOM
version = attr: SoftCOM.version.__version__
description = SoftCOM is a free software for accessing the serial port.
long_description = file: README.md
long_description_content_type = text/markdown
author = Matthew Mesropian
author_email = matt@integratedsw.tech
company = Integrated Software Technologies Inc.
url = https://github.com/mathieeo/SoftCOM
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Environment :: Console
    Topic :: Terminals :: Serial

[options]
packages = find:
include_package_data = True
python_requires = >=3.9
install_requires =
    prompt_toolkit
    pyperclip
    pyserial
# Pygments was REMOVED as a dependency in 1.6.1, not loosened. Nothing in this
# package imports it: it was needed by the AutoIt lexer that gui_controller.py
# dropped (see the note at its line ~330), and the pin outlived the code.
#
# It was actively harmful. `Pygments~=2.11.2` means >=2.11.2,<2.12.0 — a pin to
# the PATCH level — so installing softcom into any shared environment silently
# DOWNGRADED Pygments and broke whatever else needed a modern one. A real user
# hit this: sphinx (needs >=2.17) and rich (needs >=2.13) were both broken by
# `pip install softcom`. A library must never drag an unrelated toolchain
# backwards to satisfy a dependency it does not actually use.

[options.packages.find]
exclude = tests*

[options.package_data]
SoftCOM =
    support/test_log.txt
    HELP
    LICENSE

[sdist]
formats = zip, gztar

[options.entry_points]
console_scripts =
    softcom = SoftCOM.softcom:main