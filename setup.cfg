[metadata]
name = SoftCOM
version = attr: SoftCOM.version.__version__
description = SoftCOM is a free software for accessing the serial port.
long_description = file: README.md
long_description_content_type = text/markdown
author = Matthew Mesropian
author_email = matt@integratedsw.tech
company = Integrated Software Technologies Inc.
url = https://github.com/mathieeo/SoftCOM
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Environment :: Console
    Topic :: Terminals :: Serial

[options]
packages = find:
include_package_data = True
python_requires = >=3.9
install_requires =
    prompt_toolkit
    Pygments~=2.11.2
    pyperclip
    pyserial

[options.packages.find]
exclude = tests*

[options.package_data]
SoftCOM =
    support/test_log.txt
    HELP
    LICENSE

[sdist]
formats = zip, gztar

[options.entry_points]
console_scripts =
    softcom = SoftCOM.softcom:main